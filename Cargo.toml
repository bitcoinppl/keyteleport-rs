[package]
name = "keyteleport"
version = "0.1.0"
edition = "2024"
description = "A Rust implementation of the COLDCARD Key Teleport protocol"
license = "MIT"
repository = "https://github.com/bitcoinppl/keyteleport-rs"
documentation = "https://docs.rs/keyteleport"
readme = "README.md"
keywords = ["bitcoin", "coldcard", "key-teleport", "bbqr"]
categories = ["cryptography", "encoding"]

[dependencies]
aes = { version = "0.9.1", features = ["zeroize"] }
bbqr = { version = "0.5.0", default-features = false }
bip39 = { version = "2.2.2", features = ["all-languages", "zeroize"] }
bitcoin = "0.32.9"
ctr = { version = "0.10.1", features = ["zeroize"] }
data-encoding = "2.11.0"
pbkdf2 = "0.13.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"
zeroize = { version = "1.8.2", features = ["derive"] }
